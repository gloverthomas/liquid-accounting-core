name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build

  assistant-unit:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: AI Assistant unit tests (Vitest + RTL)
        run: npm run test:unit

  smoke:
    runs-on: ubuntu-latest
    needs: build
    steps:

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start Vite preview
        run: |
          npm run build
          npx vite preview --host 127.0.0.1 --port 3000 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/ >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: Smoke
        run: npx playwright test e2e/smoke.spec.ts
        env:
          CORE_APP_URL: http://127.0.0.1:3000

  parity-proof:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Core
        uses: actions/checkout@v4
        with:
          path: core
      - name: Checkout Reporting
        uses: actions/checkout@v4
        with:
          repository: gloverthomas/liquid-accounting-reporting
          path: reporting
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            core/package-lock.json
            reporting/package-lock.json
      - name: Install + build both apps
        run: |
          (cd core && npm ci && npm run build)
          (cd reporting && npm ci && npm run build)
      - name: Install Playwright
        working-directory: core
        run: npx playwright install --with-deps chromium
      - name: Start Core + Reporting previews
        run: |
          (cd core && npx vite preview --host 127.0.0.1 --port 3000) &
          (cd reporting && npx vite preview --host 127.0.0.1 --port 3001) &
          for i in $(seq 1 45); do
            curl -sf http://127.0.0.1:3000/ >/dev/null && curl -sf http://127.0.0.1:3001/ >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: Parity + Help screenshots
        working-directory: core
        run: npm run test:e2e:parity
        env:
          CORE_APP_URL: http://127.0.0.1:3000
          REPORTING_APP_URL: http://127.0.0.1:3001
      - name: Upload screenshot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: help-parity-proof
          path: core/e2e/proof/*.png
          if-no-files-found: warn
      # Proof images live on a side branch so the PR head (and its required checks) never moves.
      - name: Publish proof images to pr-proof branch
        id: proof
        if: github.event_name == 'pull_request' && always()
        working-directory: core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(e2e/proof/*.png)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No proof PNGs to publish."
            exit 0
          fi
          branch="pr-proof/pr-${{ github.event.pull_request.number }}"
          dir="$(mktemp -d)"
          cp "${files[@]}" "$dir/"
          cd "$dir"
          git init -q -b "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "chore(ci): visual proof for PR #${{ github.event.pull_request.number }} (run ${{ github.run_id }})"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/${branch}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Comment proof on PR (inline images)
        if: github.event_name == 'pull_request' && always() && steps.proof.outputs.sha != ''
        working-directory: core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(e2e/proof/*.png)
          BASE="https://raw.githubusercontent.com/${{ github.repository }}/${{ steps.proof.outputs.sha }}"
          BODY="## Visual proof (Playwright)

          CI run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Screenshots below are published to branch \`pr-proof/pr-${{ github.event.pull_request.number }}\` so you can review without downloading the **help-parity-proof** artifact zip.

          "
          for f in "${files[@]}"; do
            name="$(basename "$f")"
            BODY="${BODY}
          ### ${name}
          ![${name}](${BASE}/${name})
          "
          done
          BODY="${BODY}
          <details>
          <summary>Artifact backup</summary>

          Download artifact **help-parity-proof** from the CI run above if images fail to load.
          </details>
          "
          gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --body "$BODY" || true
      - name: Post visual proof to Linear issues
        if: github.event_name == 'pull_request' && always()
        working-directory: core
        env:
          GH_TOKEN: ${{ github.token }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PROOF_DIR: e2e/proof
          JOB_LABEL: parity-proof
        run: node scripts/post-linear-visual-proof.mjs

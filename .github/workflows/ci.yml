name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build

  assistant-unit:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: AI Assistant unit tests (Vitest + RTL)
        run: npm run test:unit

  smoke:
    runs-on: ubuntu-latest
    needs: build
    steps:

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start Vite preview
        run: |
          npm run build
          npx vite preview --host 127.0.0.1 --port 3000 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/ >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: Smoke
        run: npx playwright test e2e/smoke.spec.ts
        env:
          CORE_APP_URL: http://127.0.0.1:3000

  parity-proof:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout Core
        uses: actions/checkout@v4
        with:
          path: core
      - name: Checkout Reporting
        uses: actions/checkout@v4
        with:
          repository: gloverthomas/liquid-accounting-reporting
          path: reporting
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            core/package-lock.json
            reporting/package-lock.json
      - name: Install + build both apps
        run: |
          (cd core && npm ci && npm run build)
          (cd reporting && npm ci && npm run build)
      - name: Install Playwright
        working-directory: core
        run: npx playwright install --with-deps chromium
      - name: Start Core + Reporting previews
        run: |
          (cd core && npx vite preview --host 127.0.0.1 --port 3000) &
          (cd reporting && npx vite preview --host 127.0.0.1 --port 3001) &
          for i in $(seq 1 45); do
            curl -sf http://127.0.0.1:3000/ >/dev/null && curl -sf http://127.0.0.1:3001/ >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: Parity + Help screenshots
        working-directory: core
        run: npm run test:e2e:parity
        env:
          CORE_APP_URL: http://127.0.0.1:3000
          REPORTING_APP_URL: http://127.0.0.1:3001
      - name: Upload screenshot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: help-parity-proof
          path: core/e2e/proof/*.png
          if-no-files-found: warn
      - name: Publish proof on PR branch for inline viewing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(e2e/proof/*.png)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No proof PNGs to publish."
            exit 0
          fi
          mkdir -p docs/pr-proof
          for f in "${files[@]}"; do
            cp "$f" "docs/pr-proof/$(basename "$f")"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/pr-proof/
          git diff --staged --quiet && echo "Proof unchanged on branch." && exit 0
          git commit -m "chore(ci): visual proof screenshots"
          git pull origin "${{ github.head_ref }}" --rebase --autostash || git pull origin "${{ github.head_ref }}" --ff-only
          git push origin "HEAD:${{ github.head_ref }}"
      - name: Comment proof on PR (inline images)
        if: github.event_name == 'pull_request' && always()
        working-directory: core
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          git pull origin "${{ github.head_ref }}" --ff-only 2>/dev/null || true
          files=(docs/pr-proof/*.png)
          if [ ${#files[@]} -eq 0 ]; then
            files=(e2e/proof/*.png)
          fi
          if [ ${#files[@]} -eq 0 ]; then
            echo "No proof files for PR comment."
            exit 0
          fi
          SHA="$(git rev-parse HEAD)"
          BASE="https://raw.githubusercontent.com/${{ github.repository }}/${SHA}/docs/pr-proof"
          BODY="## Visual proof (Playwright)

          CI run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Screenshots below are on this PR branch (\`docs/pr-proof/\`). Open the linked GitHub PR from Linear to review without downloading the **help-parity-proof** artifact zip.

          "
          for f in "${files[@]}"; do
            name="$(basename "$f")"
            if [ -f "docs/pr-proof/$name" ]; then
              BODY="${BODY}
          ### ${name}
          ![${name}](${BASE}/${name})
          "
            fi
          done
          BODY="${BODY}
          <details>
          <summary>Artifact backup</summary>

          Download artifact **help-parity-proof** from the CI run above if images fail to load.
          </details>
          "
          gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --body "$BODY" || true
      - name: Post visual proof to Linear issues
        if: github.event_name == 'pull_request' && always()
        working-directory: core
        env:
          GH_TOKEN: ${{ github.token }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PROOF_DIR: docs/pr-proof
          JOB_LABEL: parity-proof
        run: node scripts/post-linear-visual-proof.mjs
